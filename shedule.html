<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日程规划 / Расписание</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
<style>
  :root {
    --墨色: #1a1a2e;
    --深蓝: #16213e;
    --中蓝: #0f3460;
    --金色: #e94560;
    --浅金: #f5a623;
    --纸白: #fdf6e3;
    --淡米: #f0e6cc;
    --文字: #2c2c2c;
    --浅灰: #888;
    --格线: rgba(233, 69, 96, 0.15);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Serif SC', serif;
    background: var(--纸白);
    min-height: 100vh;
    color: var(--文字);
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: 
      repeating-linear-gradient(0deg, transparent, transparent 29px, var(--格线) 29px, var(--格线) 30px),
      repeating-linear-gradient(90deg, transparent, transparent 29px, var(--格线) 29px, var(--格线) 30px);
    pointer-events: none;
    z-index: 0;
  }

  .应用容器 {
    position: relative;
    z-index: 1;
    max-width: 900px;
    margin: 0 auto;
    padding: 40px 20px;
  }

  .顶部区域 {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 40px;
    flex-wrap: wrap;
    gap: 12px;
  }

  .标题块 { display: flex; flex-direction: column; }

  .主标题 {
    font-family: 'ZCOOL XiaoWei', serif;
    font-size: 48px;
    color: var(--墨色);
    letter-spacing: 4px;
    line-height: 1;
  }

  .副标题 {
    font-size: 12px;
    color: var(--浅灰);
    letter-spacing: 6px;
    margin-top: 6px;
    text-transform: uppercase;
  }

  .右侧控件 {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .语言按钮 {
    padding: 6px 14px;
    border: 1px solid var(--墨色);
    background: transparent;
    color: var(--墨色);
    font-family: 'Noto Serif SC', serif;
    font-size: 12px;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .语言按钮:hover { background: var(--墨色); color: white; }

  .月份导航 {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .月份显示 {
    font-family: 'ZCOOL XiaoWei', serif;
    font-size: 28px;
    color: var(--墨色);
    min-width: 160px;
    text-align: center;
    letter-spacing: 2px;
  }

  .导航按钮 {
    width: 44px; height: 44px;
    border: 2px solid var(--金色);
    background: transparent;
    color: var(--金色);
    font-size: 20px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
    font-family: serif;
  }
  .导航按钮:hover { background: var(--金色); color: white; transform: scale(1.05); }

  .年月选择 {
    border: 1px solid var(--淡米);
    background: white;
    color: var(--墨色);
    font-family: 'Noto Serif SC', serif;
    font-size: 12px;
    padding: 8px 10px;
    outline: none;
    cursor: pointer;
  }
  .年月选择:focus { border-color: var(--金色); }

  .今天按钮 {
    padding: 8px 16px;
    border: 1px solid var(--金色);
    background: transparent;
    color: var(--金色);
    font-family: 'Noto Serif SC', serif;
    font-size: 12px;
    letter-spacing: 2px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .今天按钮:hover { background: var(--金色); color: white; }

  .日历主体 {
    background: white;
    border: 1px solid var(--淡米);
    box-shadow: 8px 8px 0px var(--淡米), 16px 16px 0px rgba(233,69,96,0.08);
  }

  .星期头部 {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    border-bottom: 2px solid var(--墨色);
  }

  .星期格 {
    padding: 14px 8px;
    text-align: center;
    font-size: 12px;
    letter-spacing: 3px;
    color: var(--浅灰);
    border-right: 1px solid var(--淡米);
  }
  .星期格:last-child { border-right: none; }
  .星期格:first-child, .星期格:last-child { color: var(--金色); }

  .日历网格 {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
  }

  .日期格子 {
    aspect-ratio: 1;
    border-right: 1px solid var(--淡米);
    border-bottom: 1px solid var(--淡米);
    padding: 10px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    position: relative;
    transition: background 0.15s;
    overflow: hidden;
    min-height: 90px;
  }
  .日期格子:nth-child(7n) { border-right: none; }
  .日期格子:hover { background: rgba(233, 69, 96, 0.04); z-index: 1; }
  .日期格子.其他月份 { background: rgba(240,230,204,0.2); opacity: 0.5; cursor: default; }
  .日期格子.其他月份:hover { background: rgba(240,230,204,0.2); }
  .日期格子.今天 { background: rgba(233, 69, 96, 0.06); }
  .日期格子.今天 .日期数字 {
    background: var(--金色); color: white;
    width: 28px; height: 28px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700;
  }
  .日期格子.周末 .日期数字 { color: var(--金色); }

  .日期数字 {
    font-size: 15px; font-weight: 600;
    color: var(--墨色); line-height: 1;
    margin-bottom: 6px;
    width: 28px; height: 28px;
    display: flex; align-items: center; justify-content: center;
  }

  .备忘预览列表 {
    display: flex; flex-direction: column; gap: 2px;
    flex: 1; overflow: hidden;
  }

  .备忘预览条 {
    font-size: 10px; line-height: 1.4;
    color: var(--文字);
    background: rgba(233, 69, 96, 0.08);
    border-left: 2px solid var(--金色);
    padding: 2px 4px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    border-radius: 0 2px 2px 0;
    transition: all 0.2s;
  }
  .备忘预览条.已完成 {
    text-decoration: line-through; color: var(--浅灰);
    opacity: 0.6; border-left-color: var(--浅灰);
    background: rgba(136, 136, 136, 0.08);
  }

  .更多备忘 { font-size: 9px; color: var(--浅灰); text-align: right; margin-top: 1px; }

  .备忘角标 {
    position: absolute; top: 6px; right: 6px;
    width: 6px; height: 6px;
    background: var(--浅金); border-radius: 50%;
  }

  /* ===== 遮罩 & 弹窗 ===== */
  .遮罩层 {
    position: fixed; inset: 0;
    background: rgba(26, 26, 46, 0.7);
    z-index: 100;
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(4px);
    opacity: 0; visibility: hidden;
    transition: all 0.3s;
  }
  .遮罩层.显示中 { opacity: 1; visibility: visible; }

  .备忘录弹窗 {
    background: var(--纸白);
    width: 600px;
    max-width: 95vw;
    max-height: 90vh;
    display: flex; flex-direction: column;
    box-shadow: 20px 20px 0 rgba(233,69,96,0.15), 0 0 0 1px var(--淡米);
    transform: translateY(30px) scale(0.96);
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    overflow: hidden;
  }
  .遮罩层.显示中 .备忘录弹窗 { transform: translateY(0) scale(1); }

  .弹窗标题栏 {
    background: var(--墨色);
    padding: 20px 24px;
    display: flex; align-items: center; justify-content: space-between;
    flex-shrink: 0;
  }

  .弹窗日期标题 {
    font-family: 'ZCOOL XiaoWei', serif;
    font-size: 24px; color: white; letter-spacing: 3px;
  }
  .弹窗日期标题 span { color: var(--金色); margin-left: 8px; font-size: 14px; letter-spacing: 1px; }

  .关闭按钮 {
    width: 36px; height: 36px;
    border: 1px solid rgba(255,255,255,0.3);
    background: transparent; color: white;
    font-size: 18px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }
  .关闭按钮:hover { background: var(--金色); border-color: var(--金色); }

  .备忘录内容区 {
    flex: 1; overflow-y: auto;
    padding: 24px;
    display: flex; flex-direction: column; gap: 16px;
  }

  .新建备忘区 {
    display: flex; flex-direction: column; gap: 10px;
    border: 1px solid var(--淡米);
    padding: 16px;
    background: white;
  }

  .输入行 {
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
  }

  .时间标签输入, .时间结束输入 {
    border: none; outline: none;
    font-family: 'Noto Serif SC', serif;
    font-size: 12px; color: var(--浅灰);
    background: transparent;
    border-bottom: 1px dashed var(--淡米);
    padding-bottom: 4px;
    width: 120px;
  }

  .时间分隔 { font-size: 11px; color: var(--浅灰); }

  .提醒选择 {
    border: none; outline: none;
    font-family: 'Noto Serif SC', serif;
    font-size: 12px; color: var(--浅灰);
    background: transparent;
    border-bottom: 1px dashed var(--淡米);
    padding-bottom: 4px;
    cursor: pointer;
    flex: 1;
    min-width: 120px;
  }

  .备忘输入框 {
    width: 100%;
    border: none; outline: none;
    font-family: 'Noto Serif SC', serif;
    font-size: 14px; color: var(--文字);
    resize: none; line-height: 1.8;
    background: transparent;
    min-height: 60px;
  }
  .备忘输入框::placeholder { color: #ccc; }

  .输入操作区 {
    display: flex; justify-content: space-between; align-items: center;
  }

  .添加按钮 {
    padding: 8px 20px;
    background: var(--金色); color: white;
    border: none;
    font-family: 'Noto Serif SC', serif;
    font-size: 13px; cursor: pointer;
    letter-spacing: 2px;
    transition: all 0.2s;
  }
  .添加按钮:hover { background: var(--墨色); transform: translateX(2px); }

  .备忘列表区 { display: flex; flex-direction: column; gap: 12px; }

  .备忘列表标题 {
    font-size: 11px; letter-spacing: 4px;
    color: var(--浅灰);
    border-bottom: 1px solid var(--淡米);
    padding-bottom: 8px;
  }

  .备忘条目 {
    display: flex; gap: 12px;
    padding: 14px; background: white;
    border: 1px solid var(--淡米);
    border-left: 3px solid var(--金色);
    position: relative;
    animation: 条目出现 0.3s ease;
    transition: all 0.2s;
  }
  .备忘条目:hover { border-left-color: var(--墨色); box-shadow: 4px 4px 0 var(--淡米); }

  @keyframes 条目出现 {
    from { opacity: 0; transform: translateX(-10px); }
    to { opacity: 1; transform: translateX(0); }
  }

  .条目复选框 {
    width: 18px; height: 18px; flex-shrink: 0;
    accent-color: var(--金色); margin-top: 2px; cursor: pointer;
  }

  .条目内容 { flex: 1; min-width: 0; }

  .条目文字 {
    font-size: 14px; line-height: 1.7;
    color: var(--文字); word-break: break-all; white-space: pre-wrap;
  }
  .条目文字.已完成 { text-decoration: line-through; color: var(--浅灰); }

  .条目时间 { font-size: 11px; color: var(--浅灰); margin-top: 4px; letter-spacing: 1px; }

  .条目提醒 { font-size: 10px; color: var(--浅金); margin-top: 3px; letter-spacing: 0.5px; }

  .条目操作区 {
    position: absolute; top: 10px; right: 10px;
    display: flex; gap: 4px;
    opacity: 0; transition: opacity 0.2s;
  }
  .备忘条目:hover .条目操作区 { opacity: 1; }

  .编辑条目按钮, .删除条目按钮 {
    width: 24px; height: 24px;
    border: none; background: transparent;
    color: #bbb; font-size: 12px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: color 0.2s;
  }
  .编辑条目按钮:hover { color: var(--墨色); }
  .删除条目按钮:hover { color: var(--金色); }

  .取消编辑按钮 {
    padding: 8px 14px;
    border: 1px solid var(--淡米);
    background: transparent;
    color: var(--浅灰);
    font-family: 'Noto Serif SC', serif;
    font-size: 12px;
    cursor: pointer;
    letter-spacing: 1px;
    display: none;
  }
  .取消编辑按钮:hover { color: var(--金色); border-color: var(--金色); }

  .空状态 {
    text-align: center; padding: 40px 20px;
    color: var(--浅灰); font-size: 13px; letter-spacing: 2px;
  }
  .空状态::before { content: '✦'; display: block; font-size: 24px; margin-bottom: 10px; color: var(--淡米); }

  .弹窗底部 {
    padding: 12px 24px;
    border-top: 1px solid var(--淡米);
    display: flex; justify-content: space-between; align-items: center;
    background: white; flex-shrink: 0;
  }

  .统计文字 { font-size: 11px; color: var(--浅灰); letter-spacing: 1px; }

  .清空按钮 {
    font-size: 11px; color: var(--浅灰);
    background: transparent; border: none;
    cursor: pointer; letter-spacing: 1px;
    padding: 4px 8px; transition: color 0.2s;
  }
  .清空按钮:hover { color: var(--金色); }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: var(--淡米); }
  ::-webkit-scrollbar-thumb { background: var(--浅灰); }

  /* ===== 底部用例说明 ===== */
  .用例说明栏 {
    margin-top: 32px;
    border-top: 2px solid var(--墨色);
    padding-top: 20px;
    display: flex; flex-wrap: wrap; gap: 10px;
  }

  .用例标签 {
    padding: 5px 12px;
    border: 1px solid var(--淡米);
    background: white;
    font-size: 11px; color: var(--浅灰);
    letter-spacing: 1px;
    display: flex; align-items: center; gap: 6px;
  }
  .用例标签 .点 {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--金色);
  }

  .设置弹窗 {
    background: var(--纸白);
    width: 420px;
    max-width: 94vw;
    box-shadow: 16px 16px 0 rgba(233,69,96,0.15), 0 0 0 1px var(--淡米);
    transform: translateY(24px) scale(0.96);
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    overflow: hidden;
  }
  .遮罩层.显示中 .设置弹窗 { transform: translateY(0) scale(1); }

  .设置内容区 {
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    background: white;
  }

  .设置按钮项 {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid var(--淡米);
    background: transparent;
    color: var(--文字);
    font-family: 'Noto Serif SC', serif;
    font-size: 13px;
    cursor: pointer;
    text-align: left;
    letter-spacing: 1px;
    transition: all 0.2s;
  }
  .设置按钮项:hover { border-color: var(--金色); color: var(--金色); }
  .设置按钮项.危险:hover { background: rgba(233, 69, 96, 0.06); }
</style>
</head>
<body>

<div class="应用容器">
  <div class="顶部区域">
    <div class="标题块">
      <div class="主标题" id="主标题">日程规划</div>
      <div class="副标题" id="副标题">Schedule · Расписание</div>
    </div>
    <div class="月份导航">
      <button class="导航按钮" id="上月按钮">‹</button>
      <select class="年月选择" id="年份选择"></select>
      <select class="年月选择" id="月份选择"></select>
      <div class="月份显示" id="月份显示"></div>
      <button class="导航按钮" id="下月按钮">›</button>
    </div>
    <div class="右侧控件">
      <button class="语言按钮" id="语言按钮">
        <span>🌐</span>
        <span id="语言文字">Рус</span>
      </button>
      <button class="今天按钮" id="设置按钮">设置</button>
      <button class="今天按钮" id="今天按钮">今天</button>
    </div>
  </div>

  <div class="日历主体">
    <div class="星期头部" id="星期头部">
      <div class="星期格">日</div>
      <div class="星期格">一</div>
      <div class="星期格">二</div>
      <div class="星期格">三</div>
      <div class="星期格">四</div>
      <div class="星期格">五</div>
      <div class="星期格">六</div>
    </div>
    <div class="日历网格" id="日历网格"></div>
  </div>

  <div class="用例说明栏" id="用例说明栏"></div>
</div>

<div class="遮罩层" id="遮罩层">
  <div class="备忘录弹窗">
    <div class="弹窗标题栏">
      <div class="弹窗日期标题" id="弹窗标题"></div>
      <button class="关闭按钮" id="关闭按钮">✕</button>
    </div>
    <div class="备忘录内容区">
      <div class="新建备忘区">
        <div class="输入行">
          <input class="时间标签输入" id="时间输入" type="text" maxlength="10">
          <span class="时间分隔">—</span>
          <input class="时间结束输入" id="时间结束输入" type="text" maxlength="10">
          <select class="提醒选择" id="提醒选择">
            <option value="">🔔 不提醒</option>
            <option value="5分钟前">🔔 5分钟前</option>
            <option value="15分钟前">🔔 15分钟前</option>
            <option value="30分钟前">🔔 30分钟前</option>
            <option value="1小时前">🔔 1小时前</option>
          </select>
        </div>
        <textarea class="备忘输入框" id="备忘输入" rows="3"></textarea>
        <div class="输入操作区">
          <span id="快捷提示" style="font-size:11px;color:#ccc;letter-spacing:1px"></span>
          <div style="display:flex;gap:8px;align-items:center;">
            <button class="取消编辑按钮" id="取消编辑按钮"></button>
            <button class="添加按钮" id="添加按钮"></button>
          </div>
        </div>
      </div>
      <div class="备忘列表区">
        <div class="备忘列表标题" id="已记录标题"></div>
        <div id="备忘列表容器"></div>
      </div>
    </div>
    <div class="弹窗底部">
      <span class="统计文字" id="统计文字"></span>
      <button class="清空按钮" id="清空按钮"></button>
    </div>
  </div>
</div>

<div class="遮罩层" id="设置遮罩层">
  <div class="设置弹窗">
    <div class="弹窗标题栏">
      <div class="弹窗日期标题" id="设置标题"></div>
      <button class="关闭按钮" id="关闭设置按钮">✕</button>
    </div>
    <div class="设置内容区">
      <button class="设置按钮项" id="设置语言按钮"></button>
      <button class="设置按钮项" id="设置密码按钮"></button>
      <button class="设置按钮项 危险" id="退出登录按钮"></button>
    </div>
  </div>
</div>

<script>
const IS_FILE_PROTOCOL = window.location.protocol === 'file:';
const API_HOST = window.location.hostname || '127.0.0.1';
const API_PROTOCOL = window.location.protocol === 'https:' ? 'https:' : 'http:';
const API_BASE = `${API_PROTOCOL}//${API_HOST}:3000/api`;
const LOGIN_PAGE = 'login.html';

const 翻译 = {
  zh: {
    主标题: '日程规划',
    副标题: 'Schedule · Расписание',
    语言切换: 'Рус',
    今天: '今天',
    设置按钮: '设置',
    设置标题: '设置',
    设置语言按钮: '切换语言',
    设置密码按钮: '修改密码',
    退出登录按钮: '退出登录',
    退出登录确认: '确定要退出登录吗？',

function t(k) {
  return 翻译[当前语言][k];
}

function 获取日期键(y, m, d) {
  return `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
}

function 标准化任务(task) {
  if (!task) {
    return {
      id: '',
      文字: '',
      时间标签: '',
      时间结束: '',
      提醒: '',
      提醒时间: '',
      日期: '',
      已完成: false
    };
  }

  return {
    id: task.id,
    文字: task.文字 ?? task.text ?? task.title ?? '',
    时间标签: task.时间标签 ?? task.startTime ?? '',
    时间结束: task.时间结束 ?? task.endTime ?? '',
    提醒: task.提醒 ?? task.reminder ?? '',
    提醒时间: task.提醒时间 ?? task.reminderAt ?? '',
    日期: task.日期 ?? task.date ?? '',
    已完成: task.已完成 ?? task.completed ?? task.isCompleted ?? false
  };
}

function 标准化任务分组(grouped) {
  const result = {};
  Object.entries(grouped || {}).forEach(([dateKey, tasks]) => {
    result[dateKey] = 排序任务列表((tasks || []).map(标准化任务));
  });
  return result;
}

function 时间转分钟(value) {
  if (!value) return null;
  const match = String(value).match(/^(\d{2}):(\d{2})$/);
  if (!match) return null;
  return Number(match[1]) * 60 + Number(match[2]);
}

function 获取任务时长(任务) {
  const start = 时间转分钟(任务.时间标签);
  const end = 时间转分钟(任务.时间结束);
  if (start === null || end === null || end < start) return 0;
  return end - start;
}

function 排序任务列表(list) {
  return [...(list || [])].sort((a, b) => {
    const startA = 时间转分钟(a.时间标签);
    const startB = 时间转分钟(b.时间标签);
    const normalizedA = startA === null ? Number.MAX_SAFE_INTEGER : startA;
    const normalizedB = startB === null ? Number.MAX_SAFE_INTEGER : startB;
    if (normalizedA !== normalizedB) return normalizedA - normalizedB;
    const durationDiff = 获取任务时长(b) - 获取任务时长(a);
    if (durationDiff !== 0) return durationDiff;
    return Number(a.id || 0) - Number(b.id || 0);
  });
}

function 规范化时间输入(value) {
  const raw = (value || '').trim();
  if (!raw) return { ok: true, value: null };

  if (/^\d{1,2}:\d{2}$/.test(raw)) {
    const [h, m] = raw.split(':').map(Number);
    if (h >= 0 && h <= 23 && m >= 0 && m <= 59) {
      return { ok: true, value: `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}` };
    }
    return { ok: false, message: '时间请输入有效的 24 小时制，例如 09:30 或 18:05' };
  }

  if (/^\d{3,4}$/.test(raw)) {
    const padded = raw.padStart(4, '0');
    const h = Number(padded.slice(0, 2));
    const m = Number(padded.slice(2, 4));
    if (h >= 0 && h <= 23 && m >= 0 && m <= 59) {
      return { ok: true, value: `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}` };
    }
    return { ok: false, message: '时间请输入有效的 24 小时制，例如 09:30、930 或 1230' };
  }

  if (/^\d{1,2}$/.test(raw)) {
    const h = Number(raw);
    if (h >= 0 && h <= 23) {
      return { ok: true, value: `${String(h).padStart(2, '0')}:00` };
    }
    return { ok: false, message: '小时请输入 0 到 23，例如 9、09 或 18' };
  }

  return { ok: false, message: '时间格式不正确，请输入 09:30、930、1230 这类格式' };
}

async function api(url, options = {}) {
  const headers = options.body
    ? { 'Content-Type': 'application/json', ...(options.headers || {}) }
    : { ...(options.headers || {}) };

  const res = await fetch(url, {
    ...options,
    headers,
    credentials: 'include'
  });

  const data = await res.json().catch(() => null);
  if (!res.ok) {
    const error = new Error((data && data.message) || '请求失败');
    error.status = res.status;
    throw error;
  }

  return data;
}

function 处理鉴权失败(error) {
  if (!error || error.status !== 401) return false;
  if (IS_FILE_PROTOCOL) {
    alert('当前页面是直接双击打开的 file:// 页面，session 不会正常工作。请用 VSCode Live Server 打开登录页后再进入日历页。');
  } else {
    alert(`当前无法读取日程。请先用同一地址登录；如果当前页面是 ${API_HOST}，登录页也请用 ${API_HOST} 打开，并确认后端运行的是 app.js。`);
  }
  window.location.href = LOGIN_PAGE;
  return true;
}

async function 加载当月数据() {
  const { 年, 月 } = 当前年月;
  try {
    const data = await api(`${API_BASE}/tasks/month/${年}/${月}`);
    备忘数据 = 标准化任务分组(data);
    return true;
  } catch (error) {
    console.error('加载当月任务失败', error);
    if (处理鉴权失败(error)) return false;
    alert(`加载日程失败：${error.message}`);
    备忘数据 = {};
    return false;
  }
}

async function 加载当天数据(日期键) {
  try {
    const tasks = await api(`${API_BASE}/tasks/date/${日期键}`);
    return (tasks || []).map(标准化任务);
  } catch (error) {
    console.error('加载当天任务失败', error);
    if (处理鉴权失败(error)) return null;
    alert(`读取当天日程失败：${error.message}`);
    return [];
  }
}

function 填充年月选择() {
  const 年份选择 = document.getElementById('年份选择');
  const 月份选择 = document.getElementById('月份选择');
  const currentYear = new Date().getFullYear();
  const minYear = Math.min(currentYear - 5, 当前年月.年 - 2);
  const maxYear = Math.max(currentYear + 5, 当前年月.年 + 2);

  年份选择.innerHTML = '';
  for (let y = minYear; y <= maxYear; y++) {
    const opt = document.createElement('option');
    opt.value = String(y);
    opt.textContent = t('年份标签')(y);
    年份选择.appendChild(opt);
  }
  年份选择.value = String(当前年月.年);

  月份选择.innerHTML = '';
  for (let m = 1; m <= 12; m++) {
    const opt = document.createElement('option');
    opt.value = String(m);
    opt.textContent = t('月份标签')(m);
    月份选择.appendChild(opt);
  }
  月份选择.value = String(当前年月.月);
}

function 渲染日历() {
  const { 年, 月 } = 当前年月;
  const 今天 = new Date();
  document.getElementById('月份显示').textContent = t('月份格式')(年, 月);
  填充年月选择();

  const 本月第一天 = new Date(年, 月 - 1, 1);
  const 本月天数 = new Date(年, 月, 0).getDate();
  const 首日星期 = 本月第一天.getDay();
  const 上月天数 = new Date(年, 月 - 1, 0).getDate();
  const 网格 = document.getElementById('日历网格');
  网格.innerHTML = '';

  const 总格数 = Math.ceil((首日星期 + 本月天数) / 7) * 7;

  for (let i = 0; i < 总格数; i++) {
    const 格子 = document.createElement('div');
    格子.className = '日期格子';
    let 是本月 = true;
    let 显示年 = 年;
    let 显示月 = 月;
    let 显示日;

    if (i < 首日星期) {
      显示日 = 上月天数 - 首日星期 + i + 1;
      显示月 = 月 - 1 || 12;
      显示年 = 月 === 1 ? 年 - 1 : 年;
      是本月 = false;
      格子.classList.add('其他月份');
    } else if (i >= 首日星期 + 本月天数) {
      显示日 = i - 首日星期 - 本月天数 + 1;
      显示月 = (月 % 12) + 1;
      显示年 = 月 === 12 ? 年 + 1 : 年;
      是本月 = false;
      格子.classList.add('其他月份');
    } else {
      显示日 = i - 首日星期 + 1;
    }

    const 星期几 = i % 7;
    if ((星期几 === 0 || 星期几 === 6) && 是本月) 格子.classList.add('周末');

    if (
      是本月 &&
      显示年 === 今天.getFullYear() &&
      显示月 === 今天.getMonth() + 1 &&
      显示日 === 今天.getDate()
    ) {
      格子.classList.add('今天');
    }

    const 数字元素 = document.createElement('div');
    数字元素.className = '日期数字';
    数字元素.textContent = 显示日;
    格子.appendChild(数字元素);

    const 日期键 = 获取日期键(显示年, 显示月, 显示日);
    const 该日备忘 = 备忘数据[日期键] || [];

    if (该日备忘.length > 0) {
      const 角标 = document.createElement('div');
      角标.className = '备忘角标';
      格子.appendChild(角标);

      const 预览列表 = document.createElement('div');
      预览列表.className = '备忘预览列表';

      const 显示数 = Math.min(该日备忘.length, 2);
      for (let j = 0; j < 显示数; j++) {
      const 任务 = 标准化任务(该日备忘[j]);
      const 条 = document.createElement('div');
      条.className = '备忘预览条' + (任务.已完成 ? ' 已完成' : '');
      const 时间段 = 任务.时间标签
          ? (任务.时间结束 ? `${任务.时间标签}–${任务.时间结束} ` : `${任务.时间标签} `)
          : '';
        条.textContent = 时间段 + 任务.文字;
        预览列表.appendChild(条);
      }

      if (该日备忘.length > 2) {
        const 更多 = document.createElement('div');
        更多.className = '更多备忘';
        更多.textContent = t('更多')(该日备忘.length - 2);
        预览列表.appendChild(更多);
      }

      格子.appendChild(预览列表);
    }

    if (是本月) {
      格子.addEventListener('click', () => {
        打开备忘录(显示年, 显示月, 显示日);
      });
    }

    网格.appendChild(格子);
  }
}

async function 打开备忘录(年, 月, 日) {
  当前选中日期 = 获取日期键(年, 月, 日);
  const 星期 = t('星期名')[new Date(年, 月 - 1, 日).getDay()];
  document.getElementById('弹窗标题').innerHTML = t('日期格式')(年, 月, 日, 星期);
  document.getElementById('备忘输入').value = '';
  document.getElementById('时间输入').value = '';
  document.getElementById('时间结束输入').value = '';
  document.getElementById('提醒选择').value = '';

  const tasks = await 加载当天数据(当前选中日期);
  if (tasks === null) return;
  备忘数据[当前选中日期] = tasks;
  渲染备忘列表();
  document.getElementById('遮罩层').classList.add('显示中');
  setTimeout(() => document.getElementById('备忘输入').focus(), 300);
}

function 渲染备忘列表() {
  const 容器 = document.getElementById('备忘列表容器');
  const 备忘列表 = 排序任务列表(备忘数据[当前选中日期] || []);
  备忘数据[当前选中日期] = 备忘列表;

  if (备忘列表.length === 0) {
    容器.innerHTML = `<div class="空状态">${t('空状态1')}<br>${t('空状态2')}</div>`;
  } else {
    容器.innerHTML = '';
    备忘列表.forEach((项, 索引) => {
      const 任务 = 标准化任务(项);
      const 条目 = document.createElement('div');
      条目.className = '备忘条目';
      const 时间段显示 = 任务.时间标签
        ? (任务.时间结束 ? `⏰ ${任务.时间标签} — ${任务.时间结束}` : `⏰ ${任务.时间标签}`)
        : '';

      条目.innerHTML = `
        <input type="checkbox" class="条目复选框" ${任务.已完成 ? 'checked' : ''}>
        <div class="条目内容">
          <div class="条目文字 ${任务.已完成 ? '已完成' : ''}">${任务.文字}</div>
          ${时间段显示 ? `<div class="条目时间">${时间段显示}</div>` : ''}
          ${任务.提醒 ? `<div class="条目提醒">${t('提醒前缀')}${任务.提醒}</div>` : ''}
        </div>
        <div class="条目操作区">
          <button class="编辑条目按钮" title="${t('编辑按钮')}">✎</button>
          <button class="删除条目按钮" title="${t('删除按钮')}">✕</button>
        </div>
      `;

      条目.querySelector('.编辑条目按钮').addEventListener('click', () => {
        开始编辑任务(任务);
      });

      条目.querySelector('.条目复选框').addEventListener('change', async (e) => {
        const 新状态 = e.target.checked;
        try {
          await api(`${API_BASE}/tasks/${项.id}`, {
            method: 'PUT',
            body: JSON.stringify({ completed: 新状态 })
          });
          备忘数据[当前选中日期][索引].已完成 = 新状态;
          渲染备忘列表();
          渲染日历();
        } catch (error) {
          console.error('更新任务失败', error);
          if (处理鉴权失败(error)) return;
          alert(`更新失败：${error.message}`);
          e.target.checked = !新状态;
        }
      });

      条目.querySelector('.删除条目按钮').addEventListener('click', async () => {
        if (!confirm('确定删除这条日程吗？')) return;
        try {
          await api(`${API_BASE}/tasks/${任务.id}`, { method: 'DELETE' });
          备忘数据[当前选中日期].splice(索引, 1);
          if (备忘数据[当前选中日期].length === 0) delete 备忘数据[当前选中日期];
          渲染备忘列表();
          渲染日历();
          更新统计();
        } catch (error) {
          console.error('删除任务失败', error);
          if (处理鉴权失败(error)) return;
          alert(`删除失败：${error.message}`);
        }
      });

      容器.appendChild(条目);
    });
  }

  更新统计();
}

function 开始编辑任务(任务) {
  正在编辑任务ID = 任务.id;
  document.getElementById('备忘输入').value = 任务.文字;
  document.getElementById('时间输入').value = 任务.时间标签;
  document.getElementById('时间结束输入').value = 任务.时间结束;
  document.getElementById('提醒选择').value = 任务.提醒 || '';
  document.getElementById('快捷提示').textContent = t('编辑提示');
  更新语言界面();
  document.getElementById('备忘输入').focus();
}

function 退出编辑状态(清空输入 = true) {
  正在编辑任务ID = null;
  if (清空输入) {
    document.getElementById('备忘输入').value = '';
    document.getElementById('时间输入').value = '';
    document.getElementById('时间结束输入').value = '';
    document.getElementById('提醒选择').value = '';
  }
  document.getElementById('快捷提示').textContent = t('快捷提示');
  更新语言界面();
}

function 更新统计() {
  const 备忘列表 = 备忘数据[当前选中日期] || [];
  const 已完成数 = 备忘列表.filter(x => x.已完成).length;
  const el = document.getElementById('统计文字');
  el.textContent = 备忘列表.length === 0 ? t('暂无记录') : t('统计')(备忘列表.length, 已完成数);
}

async function 添加备忘() {
  const 输入框 = document.getElementById('备忘输入');
  const 时间框 = document.getElementById('时间输入');
  const 时间结束框 = document.getElementById('时间结束输入');
  const 提醒框 = document.getElementById('提醒选择');
  const 文字 = 输入框.value.trim();

  if (!文字) {
    输入框.focus();
    输入框.style.borderBottom = '1px solid var(--金色)';
    setTimeout(() => {
      输入框.style.borderBottom = '';
    }, 1000);
    return;
  }

  const 开始时间结果 = 规范化时间输入(时间框.value);
  if (!开始时间结果.ok) {
    alert(开始时间结果.message);
    时间框.focus();
    return;
  }

  const 结束时间结果 = 规范化时间输入(时间结束框.value);
  if (!结束时间结果.ok) {
    alert(结束时间结果.message);
    时间结束框.focus();
    return;
  }

  const 开始分钟 = 时间转分钟(开始时间结果.value);
  const 结束分钟 = 时间转分钟(结束时间结果.value);
  if (开始分钟 !== null && 结束分钟 !== null && 结束分钟 < 开始分钟) {
    alert(t('时间顺序错误'));
    时间结束框.focus();
    return;
  }

  时间框.value = 开始时间结果.value || '';
  时间结束框.value = 结束时间结果.value || '';

  try {
    const payload = {
      date: 当前选中日期,
      title: 文字,
      startTime: 开始时间结果.value,
      endTime: 结束时间结果.value,
      reminder: 提醒框.value
    };

    if (正在编辑任务ID) {
      const updatedTask = await api(`${API_BASE}/tasks/${正在编辑任务ID}`, {
        method: 'PUT',
        body: JSON.stringify(payload)
      });
      const 列表 = 备忘数据[当前选中日期] || [];
      const index = 列表.findIndex(task => task.id === 正在编辑任务ID);
      if (index !== -1) 列表[index] = 标准化任务(updatedTask);
      备忘数据[当前选中日期] = 排序任务列表(列表);
    } else {
      const newTask = await api(`${API_BASE}/tasks`, {
        method: 'POST',
        body: JSON.stringify(payload)
      });

      if (!备忘数据[当前选中日期]) 备忘数据[当前选中日期] = [];
      备忘数据[当前选中日期].push(标准化任务(newTask));
      备忘数据[当前选中日期] = 排序任务列表(备忘数据[当前选中日期]);
    }

    渲染备忘列表();
    渲染日历();
    退出编辑状态(true);
    输入框.focus();
  } catch (error) {
    console.error('添加任务失败', error);
    if (处理鉴权失败(error)) return;
    alert(`添加失败：${error.message}`);
  }
}

function 关闭弹窗() {
  document.getElementById('遮罩层').classList.remove('显示中');
  当前选中日期 = null;
  退出编辑状态(true);
}

async function 切换语言() {
  当前语言 = 当前语言 === 'zh' ? 'ru' : 'zh';
  localStorage.setItem('日程语言', 当前语言);
  更新语言界面();
  渲染日历();
  if (当前选中日期) 渲染备忘列表();
  try {
    await api(`${API_BASE}/settings/language`, {
      method: 'PUT',
      body: JSON.stringify({ language: 当前语言 })
    });
  } catch (error) {
    if (!处理鉴权失败(error)) console.warn('保存语言偏好失败', error);
  }
}

async function 加载用户设置() {
  try {
    const data = await api(`${API_BASE}/settings`);
    if (data.settings && data.settings.language) {
      当前语言 = data.settings.language;
      localStorage.setItem('日程语言', 当前语言);
    }
    return true;
  } catch (error) {
    if (处理鉴权失败(error)) return false;
    console.warn('加载用户设置失败', error);
    return true;
  }
}

async function 修改密码() {
  const currentPassword = prompt(`${t('修改密码标题')}\n${t('当前密码提示')}`);
  if (!currentPassword) return;
  const newPassword = prompt(t('新密码提示'));
  if (!newPassword) return;

  try {
    await api(`${API_BASE}/auth/password`, {
      method: 'PUT',
      body: JSON.stringify({ currentPassword, newPassword })
    });
    alert(t('修改密码成功'));
  } catch (error) {
    if (处理鉴权失败(error)) return;
    alert(`修改失败：${error.message}`);
  }
}

function 打开设置() {
  document.getElementById('设置遮罩层').classList.add('显示中');
}

function 关闭设置() {
  document.getElementById('设置遮罩层').classList.remove('显示中');
}

async function 退出登录() {
  if (!confirm(t('退出登录确认'))) return;
  try {
    await api(`${API_BASE}/auth/logout`, { method: 'POST' });
  } catch (error) {
    console.warn('退出登录请求失败', error);
  }
  window.location.href = LOGIN_PAGE;
}

async function 应用年月选择() {
  当前年月 = {
    年: Number(document.getElementById('年份选择').value),
    月: Number(document.getElementById('月份选择').value)
  };
  if (await 加载当月数据()) {
    渲染日历();
    检查提醒();
  }
}

function 提醒偏移分钟(label) {
  const text = String(label || '').toLowerCase();
  if (!text) return null;
  if (text.includes('5')) return 5;
  if (text.includes('15')) return 15;
  if (text.includes('30')) return 30;
  if (text.includes('1小时前') || text.includes('1 час')) return 60;
  return null;
}

function 获取提醒时间(任务) {
  if (任务.提醒时间) return new Date(任务.提醒时间);
  if (!任务.日期 || !任务.时间标签 || !任务.提醒) return null;
  const offset = 提醒偏移分钟(任务.提醒);
  if (!offset) return null;
  const eventTime = new Date(`${任务.日期}T${任务.时间标签}:00`);
  return new Date(eventTime.getTime() - offset * 60000);
}

function 触发日程提醒(任务) {
  const title = t('提醒标题');
  const body = `${任务.时间标签 ? 任务.时间标签 + ' ' : ''}${任务.文字}`;
  if ('Notification' in window && Notification.permission === 'granted') {
    new Notification(title, { body });
  } else {
    alert(`${title}\n${body}`);
  }
}

function 检查提醒() {
  const now = Date.now();
  Object.values(备忘数据).flat().map(标准化任务).forEach(任务 => {
    if (!任务.id || 任务.已完成 || !任务.提醒) return;
    const remindAt = 获取提醒时间(任务);
    if (!remindAt || Number.isNaN(remindAt.getTime())) return;
    const key = `${任务.id}:${remindAt.toISOString()}`;
    const diff = now - remindAt.getTime();
    if (diff >= 0 && diff <= 60000 && !已触发提醒.has(key)) {
      已触发提醒.add(key);
      localStorage.setItem('已触发日程提醒', JSON.stringify([...已触发提醒].slice(-200)));
      触发日程提醒(任务);
    }
  });
}

function 启动提醒检查() {
  if ('Notification' in window && Notification.permission === 'default') {
    Notification.requestPermission().catch(() => {});
  }
  if (提醒检查计时器) clearInterval(提醒检查计时器);
  提醒检查计时器 = setInterval(检查提醒, 30000);
  检查提醒();
}

document.getElementById('上月按钮').addEventListener('click', async () => {
  if (当前年月.月 === 1) {
    当前年月.年--;
    当前年月.月 = 12;
  } else {
    当前年月.月--;
  }
  if (await 加载当月数据()) {
    渲染日历();
    检查提醒();
  }
});

document.getElementById('下月按钮').addEventListener('click', async () => {
  if (当前年月.月 === 12) {
    当前年月.年++;
    当前年月.月 = 1;
  } else {
    当前年月.月++;
  }
  if (await 加载当月数据()) {
    渲染日历();
    检查提醒();
  }
});

document.getElementById('今天按钮').addEventListener('click', async () => {
  const 今天 = new Date();
  当前年月 = { 年: 今天.getFullYear(), 月: 今天.getMonth() + 1 };
  if (await 加载当月数据()) {
    渲染日历();
    检查提醒();
  }
});

document.getElementById('语言按钮').addEventListener('click', 切换语言);
document.getElementById('设置按钮').addEventListener('click', 打开设置);
document.getElementById('关闭设置按钮').addEventListener('click', 关闭设置);
document.getElementById('设置遮罩层').addEventListener('click', (e) => {
  if (e.target === document.getElementById('设置遮罩层')) 关闭设置();
});
document.getElementById('设置语言按钮').addEventListener('click', 切换语言);
document.getElementById('设置密码按钮').addEventListener('click', 修改密码);
document.getElementById('退出登录按钮').addEventListener('click', 退出登录);
document.getElementById('年份选择').addEventListener('change', 应用年月选择);
document.getElementById('月份选择').addEventListener('change', 应用年月选择);
document.getElementById('添加按钮').addEventListener('click', 添加备忘);
document.getElementById('取消编辑按钮').addEventListener('click', () => 退出编辑状态(true));
document.getElementById('备忘输入').addEventListener('keydown', (e) => {
  if (e.ctrlKey && e.key === 'Enter') 添加备忘();
});
document.getElementById('关闭按钮').addEventListener('click', 关闭弹窗);
document.getElementById('遮罩层').addEventListener('click', (e) => {
  if (e.target === document.getElementById('遮罩层')) 关闭弹窗();
});

document.getElementById('清空按钮').addEventListener('click', async () => {
  if (!当前选中日期 || !备忘数据[当前选中日期] || 备忘数据[当前选中日期].length === 0) return;
  if (!confirm(t('清空确认'))) return;

  try {
    const tasks = [...备忘数据[当前选中日期]];
    await Promise.all(tasks.map(task => api(`${API_BASE}/tasks/${task.id}`, { method: 'DELETE' })));
    delete 备忘数据[当前选中日期];
    渲染备忘列表();
    渲染日历();
  } catch (error) {
    console.error('清空任务失败', error);
    if (处理鉴权失败(error)) return;
    alert(`清空失败：${error.message}`);
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    关闭弹窗();
    关闭设置();
  }
});

(async function 初始化() {
  if (!(await 加载用户设置())) return;
  更新语言界面();
  if (await 加载当月数据()) {
    渲染日历();
    启动提醒检查();
  }
})();
</script>
</body>
</html>
