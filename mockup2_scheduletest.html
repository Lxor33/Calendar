<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日程规划 / Расписание</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
<style>
  :root {
    --墨色: #1a1a2e;
    --深蓝: #16213e;
    --中蓝: #0f3460;
    --金色: #e94560;
    --浅金: #f5a623;
    --纸白: #fdf6e3;
    --淡米: #f0e6cc;
    --文字: #2c2c2c;
    --浅灰: #888;
    --格线: rgba(233, 69, 96, 0.15);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Serif SC', serif;
    background: var(--纸白);
    min-height: 100vh;
    color: var(--文字);
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: 
      repeating-linear-gradient(0deg, transparent, transparent 29px, var(--格线) 29px, var(--格线) 30px),
      repeating-linear-gradient(90deg, transparent, transparent 29px, var(--格线) 29px, var(--格线) 30px);
    pointer-events: none;
    z-index: 0;
  }

  .应用容器 {
    position: relative;
    z-index: 1;
    max-width: 900px;
    margin: 0 auto;
    padding: 40px 20px;
  }

  .顶部区域 {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 40px;
    flex-wrap: wrap;
    gap: 12px;
  }

  .标题块 { display: flex; flex-direction: column; }

  .主标题 {
    font-family: 'ZCOOL XiaoWei', serif;
    font-size: 48px;
    color: var(--墨色);
    letter-spacing: 4px;
    line-height: 1;
  }

  .副标题 {
    font-size: 12px;
    color: var(--浅灰);
    letter-spacing: 6px;
    margin-top: 6px;
    text-transform: uppercase;
  }

  .右侧控件 {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .语言按钮 {
    padding: 6px 14px;
    border: 1px solid var(--墨色);
    background: transparent;
    color: var(--墨色);
    font-family: 'Noto Serif SC', serif;
    font-size: 12px;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .语言按钮:hover { background: var(--墨色); color: white; }

  .月份导航 {
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .月份显示 {
    font-family: 'ZCOOL XiaoWei', serif;
    font-size: 28px;
    color: var(--墨色);
    min-width: 160px;
    text-align: center;
    letter-spacing: 2px;
  }

  .导航按钮 {
    width: 44px; height: 44px;
    border: 2px solid var(--金色);
    background: transparent;
    color: var(--金色);
    font-size: 20px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
    font-family: serif;
  }
  .导航按钮:hover { background: var(--金色); color: white; transform: scale(1.05); }

  .今天按钮 {
    padding: 8px 16px;
    border: 1px solid var(--金色);
    background: transparent;
    color: var(--金色);
    font-family: 'Noto Serif SC', serif;
    font-size: 12px;
    letter-spacing: 2px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .今天按钮:hover { background: var(--金色); color: white; }

  .日历主体 {
    background: white;
    border: 1px solid var(--淡米);
    box-shadow: 8px 8px 0px var(--淡米), 16px 16px 0px rgba(233,69,96,0.08);
  }

  .星期头部 {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    border-bottom: 2px solid var(--墨色);
  }

  .星期格 {
    padding: 14px 8px;
    text-align: center;
    font-size: 12px;
    letter-spacing: 3px;
    color: var(--浅灰);
    border-right: 1px solid var(--淡米);
  }
  .星期格:last-child { border-right: none; }
  .星期格:first-child, .星期格:last-child { color: var(--金色); }

  .日历网格 {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
  }

  .日期格子 {
    aspect-ratio: 1;
    border-right: 1px solid var(--淡米);
    border-bottom: 1px solid var(--淡米);
    padding: 10px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    position: relative;
    transition: background 0.15s;
    overflow: hidden;
    min-height: 90px;
  }
  .日期格子:nth-child(7n) { border-right: none; }
  .日期格子:hover { background: rgba(233, 69, 96, 0.04); z-index: 1; }
  .日期格子.其他月份 { background: rgba(240,230,204,0.2); opacity: 0.5; cursor: default; }
  .日期格子.其他月份:hover { background: rgba(240,230,204,0.2); }
  .日期格子.今天 { background: rgba(233, 69, 96, 0.06); }
  .日期格子.今天 .日期数字 {
    background: var(--金色); color: white;
    width: 28px; height: 28px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700;
  }
  .日期格子.周末 .日期数字 { color: var(--金色); }

  .日期数字 {
    font-size: 15px; font-weight: 600;
    color: var(--墨色); line-height: 1;
    margin-bottom: 6px;
    width: 28px; height: 28px;
    display: flex; align-items: center; justify-content: center;
  }

  .备忘预览列表 {
    display: flex; flex-direction: column; gap: 2px;
    flex: 1; overflow: hidden;
  }

  .备忘预览条 {
    font-size: 10px; line-height: 1.4;
    color: var(--文字);
    background: rgba(233, 69, 96, 0.08);
    border-left: 2px solid var(--金色);
    padding: 2px 4px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    border-radius: 0 2px 2px 0;
    transition: all 0.2s;
  }
  .备忘预览条.已完成 {
    text-decoration: line-through; color: var(--浅灰);
    opacity: 0.6; border-left-color: var(--浅灰);
    background: rgba(136, 136, 136, 0.08);
  }

  .更多备忘 { font-size: 9px; color: var(--浅灰); text-align: right; margin-top: 1px; }

  .备忘角标 {
    position: absolute; top: 6px; right: 6px;
    width: 6px; height: 6px;
    background: var(--浅金); border-radius: 50%;
  }

  .遮罩层 {
    position: fixed; inset: 0;
    background: rgba(26, 26, 46, 0.7);
    z-index: 100;
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(4px);
    opacity: 0; visibility: hidden;
    transition: all 0.3s;
  }
  .遮罩层.显示中 { opacity: 1; visibility: visible; }

  .备忘录弹窗 {
    background: var(--纸白);
    width: 600px;
    max-width: 95vw;
    max-height: 90vh;
    display: flex; flex-direction: column;
    box-shadow: 20px 20px 0 rgba(233,69,96,0.15), 0 0 0 1px var(--淡米);
    transform: translateY(30px) scale(0.96);
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    overflow: hidden;
  }
  .遮罩层.显示中 .备忘录弹窗 { transform: translateY(0) scale(1); }

  .弹窗标题栏 {
    background: var(--墨色);
    padding: 20px 24px;
    display: flex; align-items: center; justify-content: space-between;
    flex-shrink: 0;
  }

  .弹窗日期标题 {
    font-family: 'ZCOOL XiaoWei', serif;
    font-size: 24px; color: white; letter-spacing: 3px;
  }
  .弹窗日期标题 span { color: var(--金色); margin-left: 8px; font-size: 14px; letter-spacing: 1px; }

  .关闭按钮 {
    width: 36px; height: 36px;
    border: 1px solid rgba(255,255,255,0.3);
    background: transparent; color: white;
    font-size: 18px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }
  .关闭按钮:hover { background: var(--金色); border-color: var(--金色); }

  .备忘录内容区 {
    flex: 1; overflow-y: auto;
    padding: 24px;
    display: flex; flex-direction: column; gap: 16px;
  }

  .新建备忘区 {
    display: flex; flex-direction: column; gap: 10px;
    border: 1px solid var(--淡米);
    padding: 16px;
    background: white;
  }

  .输入行 {
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
  }

  .时间标签输入, .时间结束输入 {
    border: none; outline: none;
    font-family: 'Noto Serif SC', serif;
    font-size: 12px; color: var(--浅灰);
    background: transparent;
    border-bottom: 1px dashed var(--淡米);
    padding-bottom: 4px;
    width: 120px;
  }

  .时间分隔 { font-size: 11px; color: var(--浅灰); }

  .提醒选择 {
    border: none; outline: none;
    font-family: 'Noto Serif SC', serif;
    font-size: 12px; color: var(--浅灰);
    background: transparent;
    border-bottom: 1px dashed var(--淡米);
    padding-bottom: 4px;
    cursor: pointer;
    flex: 1;
    min-width: 120px;
  }

  .备忘输入框 {
    width: 100%;
    border: none; outline: none;
    font-family: 'Noto Serif SC', serif;
    font-size: 14px; color: var(--文字);
    resize: none; line-height: 1.8;
    background: transparent;
    min-height: 60px;
  }
  .备忘输入框::placeholder { color: #ccc; }

  .输入操作区 {
    display: flex; justify-content: space-between; align-items: center;
  }

  .添加按钮 {
    padding: 8px 20px;
    background: var(--金色); color: white;
    border: none;
    font-family: 'Noto Serif SC', serif;
    font-size: 13px; cursor: pointer;
    letter-spacing: 2px;
    transition: all 0.2s;
  }
  .添加按钮:hover { background: var(--墨色); transform: translateX(2px); }

  .备忘列表区 { display: flex; flex-direction: column; gap: 12px; }

  .备忘列表标题 {
    font-size: 11px; letter-spacing: 4px;
    color: var(--浅灰);
    border-bottom: 1px solid var(--淡米);
    padding-bottom: 8px;
  }

  .备忘条目 {
    display: flex; gap: 12px;
    padding: 14px; background: white;
    border: 1px solid var(--淡米);
    border-left: 3px solid var(--金色);
    position: relative;
    animation: 条目出现 0.3s ease;
    transition: all 0.2s;
  }
  .备忘条目:hover { border-left-color: var(--墨色); box-shadow: 4px 4px 0 var(--淡米); }

  @keyframes 条目出现 {
    from { opacity: 0; transform: translateX(-10px); }
    to { opacity: 1; transform: translateX(0); }
  }

  .条目复选框 {
    width: 18px; height: 18px; flex-shrink: 0;
    accent-color: var(--金色); margin-top: 2px; cursor: pointer;
  }

  .条目内容 { flex: 1; min-width: 0; }

  .条目文字 {
    font-size: 14px; line-height: 1.7;
    color: var(--文字); word-break: break-all; white-space: pre-wrap;
  }
  .条目文字.已完成 { text-decoration: line-through; color: var(--浅灰); }

  .条目时间 { font-size: 11px; color: var(--浅灰); margin-top: 4px; letter-spacing: 1px; }

  .条目提醒 { font-size: 10px; color: var(--浅金); margin-top: 3px; letter-spacing: 0.5px; }

  .删除条目按钮 {
    position: absolute; top: 10px; right: 10px;
    width: 24px; height: 24px;
    border: none; background: transparent;
    color: #ddd; font-size: 14px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: color 0.2s; opacity: 0;
  }
  .备忘条目:hover .删除条目按钮 { opacity: 1; }
  .删除条目按钮:hover { color: var(--金色); }

  .空状态 {
    text-align: center; padding: 40px 20px;
    color: var(--浅灰); font-size: 13px; letter-spacing: 2px;
  }
  .空状态::before { content: '✦'; display: block; font-size: 24px; margin-bottom: 10px; color: var(--淡米); }

  .弹窗底部 {
    padding: 12px 24px;
    border-top: 1px solid var(--淡米);
    display: flex; justify-content: space-between; align-items: center;
    background: white; flex-shrink: 0;
  }

  .统计文字 { font-size: 11px; color: var(--浅灰); letter-spacing: 1px; }

  .清空按钮 {
    font-size: 11px; color: var(--浅灰);
    background: transparent; border: none;
    cursor: pointer; letter-spacing: 1px;
    padding: 4px 8px; transition: color 0.2s;
  }
  .清空按钮:hover { color: var(--金色); }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: var(--淡米); }
  ::-webkit-scrollbar-thumb { background: var(--浅灰); }

  .用例说明栏 {
    margin-top: 32px;
    border-top: 2px solid var(--墨色);
    padding-top: 20px;
    display: flex; flex-wrap: wrap; gap: 10px;
  }

  .用例标签 {
    padding: 5px 12px;
    border: 1px solid var(--淡米);
    background: white;
    font-size: 11px; color: var(--浅灰);
    letter-spacing: 1px;
    display: flex; align-items: center; gap: 6px;
  }
  .用例标签 .点 {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--金色);
  }
</style>
</head>
<body>

<div class="应用容器">
  <div class="顶部区域">
    <div class="标题块">
      <div class="主标题" id="主标题">日程规划</div>
      <div class="副标题" id="副标题">Schedule · Расписание</div>
    </div>
    <div class="月份导航">
      <button class="导航按钮" id="上月按钮">‹</button>
      <div class="月份显示" id="月份显示"></div>
      <button class="导航按钮" id="下月按钮">›</button>
    </div>
    <div class="右侧控件">
      <button class="语言按钮" id="语言按钮">
        <span>🌐</span>
        <span id="语言文字">Рус</span>
      </button>
      <button class="今天按钮" id="今天按钮">今天</button>
    </div>
  </div>

  <div class="日历主体">
    <div class="星期头部" id="星期头部">
      <div class="星期格">日</div>
      <div class="星期格">一</div>
      <div class="星期格">二</div>
      <div class="星期格">三</div>
      <div class="星期格">四</div>
      <div class="星期格">五</div>
      <div class="星期格">六</div>
    </div>
    <div class="日历网格" id="日历网格"></div>
  </div>

  <div class="用例说明栏" id="用例说明栏"></div>
</div>

<div class="遮罩层" id="遮罩层">
  <div class="备忘录弹窗">
    <div class="弹窗标题栏">
      <div class="弹窗日期标题" id="弹窗标题"></div>
      <button class="关闭按钮" id="关闭按钮">✕</button>
    </div>
    <div class="备忘录内容区">
      <div class="新建备忘区">
        <div class="输入行">
          <input class="时间标签输入" id="时间输入" type="text" maxlength="10">
          <span class="时间分隔">—</span>
          <input class="时间结束输入" id="时间结束输入" type="text" maxlength="10">
          <select class="提醒选择" id="提醒选择">
            <option value="">🔔 不提醒</option>
            <option value="5分钟前">🔔 5分钟前</option>
            <option value="15分钟前">🔔 15分钟前</option>
            <option value="30分钟前">🔔 30分钟前</option>
            <option value="1小时前">🔔 1小时前</option>
          </select>
        </div>
        <textarea class="备忘输入框" id="备忘输入" rows="3"></textarea>
        <div class="输入操作区">
          <span id="快捷提示" style="font-size:11px;color:#ccc;letter-spacing:1px"></span>
          <button class="添加按钮" id="添加按钮"></button>
        </div>
      </div>
      <div class="备忘列表区">
        <div class="备忘列表标题" id="已记录标题"></div>
        <div id="备忘列表容器"></div>
      </div>
    </div>
    <div class="弹窗底部">
      <span class="统计文字" id="统计文字"></span>
      <button class="清空按钮" id="清空按钮"></button>
    </div>
  </div>
</div>

    更多: (n) => `+${n}`,
    提醒前缀: '🔔 ',
    提醒选项: ['🔔 Без напомин.', '🔔 За 5 мин', '🔔 За 15 мин', '🔔 За 30 мин', '🔔 За 1 час'],
    提醒值: ['', 'За 5 мин', 'За 15 мин', 'За 30 мин', 'За 1 час'],
    用例标签列表: [
      'Нажать дату → добавить/просмотреть',
      '☑ Отметить → выполнено',
      '🔔 Напомин. → настройка',
      '✕ Удалить → убрать событие',
      '🌐 Язык',
      '⏰ Начало—конец',
    ],
  }
};

let 当前语言 = localStorage.getItem('日程语言') || 'zh';
function t(k) { return 翻译[当前语言][k]; }

// ========== 【核心：数据库对接函数】完美匹配你的表结构 ==========
let 全量任务数据 = {};
let 当前年月 = { 年: new Date().getFullYear(), 月: new Date().getMonth() + 1 };
let 当前选中日期 = null;

// 工具：格式化日期 yyyy-mm-dd
function 获取日期键(y, m, d) {
  return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}

// 1. 从数据库加载所有任务
async function 从数据库加载所有任务() {
  try {
    const res = await fetch(`${API_BASE}/tasks/user/${DEFAULT_USER_ID}`, {
      method: "GET",
      credentials: "include"
    });
    const data = await res.json();
    if (data.success) {
      // 把数据库数据按日期分组，适配日历渲染
      全量任务数据 = {};
      data.data.forEach(task => {
        const dateKey = task.task_date;
        if (!全量任务数据[dateKey]) 全量任务数据[dateKey] = [];
        全量任务数据[dateKey].push({
          id: task.id,
          文字: task.description || task.title,
          时间标签: task.task_time,
          时间结束: '',
          提醒: '',
          已完成: task.is_completed,
        });
      });
    }
  } catch (err) {
    console.error("加载数据库任务失败", err);
    全量任务数据 = JSON.parse(localStorage.getItem('日程规划数据') || '{}');
  }
}

// 2. 添加任务到数据库
async function 添加任务到数据库(日期键, 任务内容, 任务时间) {
  try {
    const res = await fetch(`${API_BASE}/tasks`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "include",
      // 完美匹配你的tasks表字段
      body: JSON.stringify({
        userId: DEFAULT_USER_ID,
        scheduleId: DEFAULT_SCHEDULE_ID,
        title: 任务内容.substring(0, 50),
        description: 任务内容,
        taskDate: 日期键,
        taskTime: 任务时间,
        isCompleted: false
      })
    });
    return await res.json();
  } catch (err) {
    console.error("添加任务到数据库失败", err);
    return { success: false };
  }
}

// 3. 更新任务完成状态
async function 更新任务完成状态(taskId, 完成状态) {
  try {
    const res = await fetch(`${API_BASE}/tasks/${taskId}`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      credentials: "include",
      body: JSON.stringify({ isCompleted: 完成状态 })
    });
    return await res.json();
  } catch (err) {
    console.error("更新任务状态失败", err);
    return { success: false };
  }
}

// 4. 删除任务
async function 删除数据库任务(taskId) {
  try {
    const res = await fetch(`${API_BASE}/tasks/${taskId}`, {
      method: "DELETE",
      credentials: "include"
    });
    return await res.json();
  } catch (err) {
    console.error("删除任务失败", err);
    return { success: false };
  }
}

// ========== 原有界面渲染逻辑 完全不动 ==========
function 更新提醒选项() {
  const sel = document.getElementById('提醒选择');
  const 当前值 = sel.value;
  sel.innerHTML = '';
  t('提醒选项').forEach((label, i) => {
    const opt = document.createElement('option');
    opt.value = t('提醒值')[i];
    opt.textContent = label;
    sel.appendChild(opt);
  });
  sel.value = 当前值;
}

function 渲染用例说明栏() {
  const 栏 = document.getElementById('用例说明栏');
  栏.innerHTML = '';
  t('用例标签列表').forEach(text => {
    const div = document.createElement('div');
    div.className = '用例标签';
    div.innerHTML = `<div class="点"></div><span>${text}</span>`;
    栏.appendChild(div);
  });
}

function 更新语言界面() {
  document.getElementById('主标题').textContent = t('主标题');
  document.getElementById('副标题').textContent = t('副标题');
  document.getElementById('语言文字').textContent = t('语言切换');
  document.getElementById('今天按钮').textContent = t('今天');
  document.getElementById('时间输入').placeholder = t('时间占位符');
  document.getElementById('时间结束输入').placeholder = t('时间结束占位符');
  document.getElementById('备忘输入').placeholder = t('备忘占位符');
  document.getElementById('快捷提示').textContent = t('快捷提示');
  document.getElementById('添加按钮').textContent = t('添加按钮');
  document.getElementById('已记录标题').textContent = t('已记录标题');
  document.getElementById('清空按钮').textContent = t('清空按钮');
  更新提醒选项();
  渲染用例说明栏();
  const 格列表 = document.querySelectorAll('.星期格');
  t('星期头').forEach((n, i) => { if (格列表[i]) 格列表[i].textContent = n; });
}

// 日历渲染 完全不动，仅数据源改为数据库加载的全量任务数据
function 渲染日历() {
  const { 年, 月 } = 当前年月;
  const 今天 = new Date();
  document.getElementById('月份显示').textContent = t('月份格式')(年, 月);

  const 本月第一天 = new Date(年, 月 - 1, 1);
  const 本月天数 = new Date(年, 月, 0).getDate();
  const 首日星期 = 本月第一天.getDay();
  const 上月天数 = new Date(年, 月 - 1, 0).getDate();
  const 网格 = document.getElementById('日历网格');
  网格.innerHTML = '';

  const 总格数 = Math.ceil((首日星期 + 本月天数) / 7) * 7;

  for (let i = 0; i < 总格数; i++) {
    const 格子 = document.createElement('div');
    格子.className = '日期格子';
    let 是本月 = true;
    let 显示年 = 年, 显示月 = 月, 显示日;

    if (i < 首日星期) {
      显示日 = 上月天数 - 首日星期 + i + 1;
      显示月 = 月 - 1 || 12;
      显示年 = 月 === 1 ? 年 - 1 : 年;
      是本月 = false;
      格子.classList.add('其他月份');
    } else if (i >= 首日星期 + 本月天数) {
      显示日 = i - 首日星期 - 本月天数 + 1;
      显示月 = 月 % 12 + 1;
      显示年 = 月 === 12 ? 年 + 1 : 年;
      是本月 = false;
      格子.classList.add('其他月份');
    } else {
      显示日 = i - 首日星期 + 1;
    }

    const 星期几 = i % 7;
    if ((星期几 === 0 || 星期几 === 6) && 是本月) 格子.classList.add('周末');

    if (是本月 && 显示年 === 今天.getFullYear() && 显示月 === 今天.getMonth() + 1 && 显示日 === 今天.getDate()) {
      格子.classList.add('今天');
    }

    const 数字元素 = document.createElement('div');
    数字元素.className = '日期数字';
    数字元素.textContent = 显示日;
    格子.appendChild(数字元素);

    const 日期键 = 获取日期键(显示年, 显示月, 显示日);
    const 该日备忘 = 全量任务数据[日期键] || [];

    if (该日备忘.length > 0) {
      const 角标 = document.createElement('div');
      角标.className = '备忘角标';
      格子.appendChild(角标);

      const 预览列表 = document.createElement('div');
      预览列表.className = '备忘预览列表';

      const 显示数 = Math.min(该日备忘.length, 2);
      for (let j = 0; j < 显示数; j++) {
        const 条 = document.createElement('div');
        条.className = '备忘预览条' + (该日备忘[j].已完成 ? ' 已完成' : '');
        const 时间段 = 该日备忘[j].时间标签
          ? (该日备忘[j].时间结束 ? `${该日备忘[j].时间标签}–${该日备忘[j].时间结束} ` : `${该日备忘[j].时间标签} `)
          : '';
        条.textContent = 时间段 + 该日备忘[j].文字;
        预览列表.appendChild(条);
      }

      if (该日备忘.length > 2) {
        const 更多 = document.createElement('div');
        更多.className = '更多备忘';
        更多.textContent = t('更多')(该日备忘.length - 2);
        预览列表.appendChild(更多);
      }

      格子.appendChild(预览列表);
    }

    if (是本月) {
      格子.addEventListener('click', () => 打开备忘录(显示年, 显示月, 显示日));
    }

    网格.appendChild(格子);
  }
}

// ========== 备忘录弹窗逻辑 适配数据库 ==========
function 打开备忘录(年, 月, 日) {
  当前选中日期 = 获取日期键(年, 月, 日);
  const 星期 = t('星期名')[new Date(年, 月 - 1, 日).getDay()];
  document.getElementById('弹窗标题').innerHTML = t('日期格式')(年, 月, 日, 星期);
  document.getElementById('备忘输入').value = '';
  document.getElementById('时间输入').value = '';
  document.getElementById('时间结束输入').value = '';
  document.getElementById('提醒选择').value = '';
  渲染备忘列表();
  document.getElementById('遮罩层').classList.add('显示中');
  setTimeout(() => document.getElementById('备忘输入').focus(), 300);
}

function 渲染备忘列表() {
  const 容器 = document.getElementById('备忘列表容器');
  const 备忘列表 = 全量任务数据[当前选中日期] || [];

  if (备忘列表.length === 0) {
    容器.innerHTML = `<div class="空状态">${t('空状态1')}<br>${t('空状态2')}</div>`;
  } else {
    容器.innerHTML = '';
    备忘列表.forEach((项, 索引) => {
      const 条目 = document.createElement('div');
      条目.className = '备忘条目';
      const 时间段显示 = 项.时间标签
        ? (项.时间结束 ? `⏰ ${项.时间标签} — ${项.时间结束}` : `⏰ ${项.时间标签}`)
        : '';
      条目.innerHTML = `
        <input type="checkbox" class="条目复选框" ${项.已完成 ? 'checked' : ''} data-id="${项.id}" data-index="${索引}">
        <div class="条目内容">
          <div class="条目文字 ${项.已完成 ? '已完成' : ''}">${项.文字}</div>
          ${时间段显示 ? `<div class="条目时间">${时间段显示}</div>` : ''}
          ${项.提醒 ? `<div class="条目提醒">${t('提醒前缀')}${项.提醒}</div>` : ''}
        </div>
        <button class="删除条目按钮" data-id="${项.id}" data-index="${索引}">✕</button>
      `;

      // 勾选更新完成状态
      条目.querySelector('.条目复选框').addEventListener('change', async (e) => {
        const taskId = e.target.dataset.id;
        const 索引 = e.target.dataset.index;
        const 新状态 = e.target.checked;
        await 更新任务完成状态(taskId, 新状态);
        await 从数据库加载所有任务();
        渲染备忘列表();
        渲染日历();
      });

      // 删除任务
      条目.querySelector('.删除条目按钮').addEventListener('click', async (e) => {
        const taskId = e.target.dataset.id;
        await 删除数据库任务(taskId);
        await 从数据库加载所有任务();
        渲染备忘列表();
        渲染日历();
        更新统计();
      });

      容器.appendChild(条目);
    });
  }

  更新统计();
}

function 更新统计() {
  const 备忘列表 = 全量任务数据[当前选中日期] || [];
  const 已完成数 = 备忘列表.filter(x => x.已完成).length;
  const el = document.getElementById('统计文字');
  el.textContent = 备忘列表.length === 0 ? t('暂无记录') : t('统计')(备忘列表.length, 已完成数);
}

// 添加日程
async function 添加备忘() {
  const 输入框 = document.getElementById('备忘输入');
  const 时间框 = document.getElementById('时间输入');
  const 文字 = 输入框.value.trim();

  if (!文字) {
    输入框.focus();
    输入框.style.borderBottom = '1px solid var(--金色)';
    setTimeout(() => 输入框.style.borderBottom = '', 1000);
    return;
  }

  // 写入数据库
  const 结果 = await 添加任务到数据库(当前选中日期, 文字, 时间框.value.trim());
  if (结果.success) {
    // 重新加载数据，刷新界面
    await 从数据库加载所有任务();
    渲染备忘列表();
    渲染日历();
    // 清空输入框
    输入框.value = '';
    时间框.value = '';
    document.getElementById('时间结束输入').value = '';
    document.getElementById('提醒选择').value = '';
    输入框.focus();
  } else {
    alert("添加失败，请检查后端服务是否正常运行");
  }
}

function 关闭弹窗() {
  document.getElementById('遮罩层').classList.remove('显示中');
  当前选中日期 = null;
}

function 切换语言() {
  当前语言 = 当前语言 === 'zh' ? 'ru' : 'zh';
  localStorage.setItem('日程语言', 当前语言);
  更新语言界面();
  渲染日历();
  if (当前选中日期) 渲染备忘列表();
}

// ========== 事件绑定 完全不动 ==========
document.getElementById('上月按钮').addEventListener('click', async () => {
  if (当前年月.月 === 1) { 当前年月.年--; 当前年月.月 = 12; } else { 当前年月.月--; }
  渲染日历();
});
document.getElementById('下月按钮').addEventListener('click', async () => {
  if (当前年月.月 === 12) { 当前年月.年++; 当前年月.月 = 1; } else { 当前年月.月++; }
  渲染日历();
});
document.getElementById('今天按钮').addEventListener('click', async () => {
  const 今天 = new Date();
  当前年月 = { 年: 今天.getFullYear(), 月: 今天.getMonth() + 1 };
  渲染日历();
});
document.getElementById('语言按钮').addEventListener('click', 切换语言);
document.getElementById('添加按钮').addEventListener('click', 添加备忘);
document.getElementById('备忘输入').addEventListener('keydown', (e) => { if (e.ctrlKey && e.key === 'Enter') 添加备忘(); });
document.getElementById('关闭按钮').addEventListener('click', 关闭弹窗);
document.getElementById('遮罩层').addEventListener('click', (e) => { if (e.target === document.getElementById('遮罩层')) 关闭弹窗(); });
document.getElementById('清空按钮').addEventListener('click', async () => {
  if (!当前选中日期 || !全量任务数据[当前选中日期] || 全量任务数据[当前选中日期].length === 0) return;
  if (confirm(t('清空确认'))) {
    // 批量删除当日所有任务
    const 当日任务 = 全量任务数据[当前选中日期];
    for (let task of 当日任务) {
      await 删除数据库任务(task.id);
    }
    await 从数据库加载所有任务();
    渲染备忘列表();
    渲染日历();
  }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') 关闭弹窗(); });

// ========== 页面初始化 ==========
async function 初始化() {
  await 从数据库加载所有任务(); // 优先从数据库加载
  更新语言界面();
  渲染日历();
}

// 启动页面
初始化();
</script>
